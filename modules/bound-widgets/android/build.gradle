buildscript {
  repositories {
    mavenCentral()
  }

  dependencies {
    def kotlinVer = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.2.0'
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVer}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.bound.attendance.widget'
version = '1.0.0'

def getExtOrDefault(name, defaultValue) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
  namespace "com.bound.attendance.widget"
  compileSdkVersion getExtOrDefault('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion getExtOrDefault('minSdkVersion', 24)
    targetSdkVersion getExtOrDefault('targetSdkVersion', 35)
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
    freeCompilerArgs += [
      "-opt-in=androidx.glance.ExperimentalGlanceApi"
    ]
  }

  buildFeatures {
    compose true
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${getExtOrDefault('kotlinVersion', '2.2.0')}"

  // Jetpack Glance for AppWidgets
  implementation "androidx.glance:glance-appwidget:1.1.1"
  implementation "androidx.glance:glance-material3:1.1.1"

  // Align Compose Runtime/UI with Kotlin 2.x Compose Compiler & Expo SDK 58 (overrides transitive 1.3.0)
  implementation "androidx.compose.runtime:runtime:1.7.6"
  implementation "androidx.compose.ui:ui:1.7.6"

  // Modern WorkManager for Android 14/15+ compatibility (overrides transitive 2.7.1)
  implementation "androidx.work:work-runtime-ktx:2.9.1"

  // Kotlin Coroutines & AndroidX Core
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
