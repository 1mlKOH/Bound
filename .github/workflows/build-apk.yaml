name: Build Android APK (EAS Cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (default: preview generates APK for testing)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - apk
          - development
      download_artifact:
        description: 'Download APK artifact and attach to GitHub Actions summary'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: eas-build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK on Expo EAS Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 🚀 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: ☁️ Trigger EAS Cloud Build
        id: eas_build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Triggering EAS build for Android with profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait

      - name: ⬇️ Download APK from EAS Cloud
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.download_artifact }}
        run: |
          echo "Downloading built APK from EAS servers..."
          eas build:download --platform android --non-interactive
          
          # Find downloaded APK and stage for upload
          APK_FILE=$(ls -t *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Downloaded APK file: $APK_FILE"
            cp "$APK_FILE" bound-testing.apk
            echo "APK ready at ./bound-testing.apk"
          else
            echo "Warning: No .apk file found in root directory after download."
          fi

      - name: 📤 Upload APK to GitHub Artifacts
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.download_artifact) }}
        uses: actions/upload-artifact@v4
        with:
          name: bound-android-apk
          path: ./bound-testing.apk
          if-no-files-found: warn
          retention-days: 14
