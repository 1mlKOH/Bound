# Build Android APK using Expo EAS Cloud
name: Build Android APK (EAS Cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (default: preview generates APK for testing)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - apk
          - development
      download_artifact:
        description: 'Download APK artifact and attach to GitHub Actions summary'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: eas-build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK on Expo EAS Cloud
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 🚀 Install EAS CLI
        run: npm install --global eas-cli

      - name: 🔐 Verify Expo Authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty or not configured in GitHub Secrets (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi
          echo "EXPO_TOKEN secret detected (length: ${#EXPO_TOKEN}). Verifying account with EAS..."
          eas whoami

      - name: 🔑 Set up Android Keystore & Credentials
        run: |
          mkdir -p android/keystores
          keytool -genkey -v \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bound123456 \
            -keypass bound123456 \
            -alias bound-key \
            -keystore android/keystores/release.keystore \
            -dname "CN=Bound,OU=Mobile,O=BoundApp,L=SanFrancisco,S=CA,C=US"
          
          cat << 'EOF' > credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "android/keystores/release.keystore",
                "keystorePassword": "bound123456",
                "keyAlias": "bound-key",
                "keyPassword": "bound123456"
              }
            }
          }
          EOF
          echo "✅ Keystore and credentials.json ready for local credential signing."

      - name: 📦 Install dependencies for Config Plugins
        run: |
          npm install --legacy-peer-deps --ignore-scripts || npm install --force --ignore-scripts

      - name: ☁️ Trigger EAS Cloud Build
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          if [ -z "$PROFILE" ]; then
            PROFILE="preview"
          fi
          echo "Triggering EAS build for Android with profile: $PROFILE"
          BUILD_EXIT_CODE=0
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --clear-cache \
            --verbose-logs \
            --wait > eas-build.log 2>&1 || BUILD_EXIT_CODE=$?
          cat eas-build.log
          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "EAS Build failed with code $BUILD_EXIT_CODE"
            exit $BUILD_EXIT_CODE
          fi

          BUILD_ID=$(grep -oE '/builds/[a-f0-9-]{36}' eas-build.log | cut -d/ -f3 | head -n 1)
          echo "Extracted EAS Build ID: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          echo "### 🚀 Expo EAS Cloud Build Completed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platform**: Android (APK)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Profile**: $PROFILE" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BUILD_ID" ]; then
            echo "- **Build ID**: \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Expo Direct Link**: [Install / Download APK](https://expo.dev/accounts/w0lfgang/projects/bound/builds/$BUILD_ID)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ⬇️ Download APK from EAS Cloud
        id: download_apk
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.download_artifact }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          if [ -z "$BUILD_ID" ] && [ -f eas-build.log ]; then
            BUILD_ID=$(grep -oE '/builds/[a-f0-9-]{36}' eas-build.log | cut -d/ -f3 | head -n 1)
          fi
          echo "Target EAS Build ID: $BUILD_ID"

          rm -f ./bound-testing.apk
          if [ -n "$BUILD_ID" ]; then
            echo "Downloading APK for build $BUILD_ID..."
            eas build:download --build-id "$BUILD_ID" --output ./bound-testing.apk --non-interactive || \
            eas build:download --build-id "$BUILD_ID" --non-interactive || \
            echo "::warning::eas build:download encountered an issue. Build is accessible directly at https://expo.dev/accounts/w0lfgang/projects/bound/builds/$BUILD_ID"
          else
            echo "Attempting fallback download by platform..."
            eas build:download --platform android --non-interactive || true
          fi

          # Find downloaded APK and stage for upload
          APK_FILE=$(ls -t *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Downloaded APK file: $APK_FILE"
            if [ "$APK_FILE" != "bound-testing.apk" ]; then
              cp "$APK_FILE" bound-testing.apk
            fi
            echo "APK ready at ./bound-testing.apk ($(du -h bound-testing.apk | cut -f1))"
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
            echo "- **Artifact**: \`bound-testing.apk\` ready for download" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Warning: No .apk file found in root directory after download."
            echo "apk_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload APK to GitHub Artifacts
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.download_artifact) }}
        uses: actions/upload-artifact@v4
        with:
          name: bound-android-apk
          path: ./bound-testing.apk
          if-no-files-found: warn
          retention-days: 14

      - name: 📋 Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-failure-log
          path: eas-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 📢 Report Diagnostics to GitHub Commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const log = fs.existsSync("eas-build.log") ? fs.readFileSync("eas-build.log", "utf8").slice(-15000) : "No log found";
            const body = "### 🔍 EAS Build Diagnostic Log\n```\n" + log + "\n```";
            fs.writeFileSync("/tmp/comment.json", JSON.stringify({ body }));
          '
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/comment.json || true
