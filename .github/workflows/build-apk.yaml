# Build Android APK using Expo EAS Cloud
name: Build Android APK (EAS Cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (default: preview generates APK for testing)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - apk
          - development
      download_artifact:
        description: 'Download APK artifact and attach to GitHub Actions summary'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: eas-build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK on Expo EAS Cloud
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🚀 Install EAS CLI
        run: npm install --global eas-cli

      - name: 🔐 Verify Expo Authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty or not configured in GitHub Secrets (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi
          echo "EXPO_TOKEN secret detected (length: ${#EXPO_TOKEN}). Verifying account with EAS..."
          eas whoami

      - name: 🔑 Set up Android Keystore & Credentials
        run: |
          mkdir -p android/keystores
          keytool -genkey -v \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bound123456 \
            -keypass bound123456 \
            -alias bound-key \
            -keystore android/keystores/release.keystore \
            -dname "CN=Bound,OU=Mobile,O=BoundApp,L=SanFrancisco,S=CA,C=US"
          
          cat << 'EOF' > credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "android/keystores/release.keystore",
                "keystorePassword": "bound123456",
                "keyAlias": "bound-key",
                "keyPassword": "bound123456"
              }
            }
          }
          EOF
          echo "✅ Keystore and credentials.json ready for local credential signing."

      - name: ☁️ Trigger EAS Cloud Build
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          if [ -z "$PROFILE" ]; then
            PROFILE="preview"
          fi
          echo "Triggering EAS build for Android with profile: $PROFILE"
          BUILD_EXIT_CODE=0
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait > eas-build.log 2>&1 || BUILD_EXIT_CODE=$?
          cat eas-build.log
          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "EAS Build failed with code $BUILD_EXIT_CODE"
            exit $BUILD_EXIT_CODE
          fi

      - name: ⬇️ Download APK from EAS Cloud
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.download_artifact }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Downloading built APK from EAS servers..."
          eas build:download --platform android --non-interactive
          
          # Find downloaded APK and stage for upload
          APK_FILE=$(ls -t *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Downloaded APK file: $APK_FILE"
            cp "$APK_FILE" bound-testing.apk
            echo "APK ready at ./bound-testing.apk"
          else
            echo "Warning: No .apk file found in root directory after download."
          fi

      - name: 📤 Upload APK to GitHub Artifacts
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.download_artifact) }}
        uses: actions/upload-artifact@v4
        with:
          name: bound-android-apk
          path: ./bound-testing.apk
          if-no-files-found: warn
          retention-days: 14

      - name: 📋 Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-failure-log
          path: eas-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 📢 Report Diagnostics to GitHub Commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f eas-build.log ]; then
            LOG_SNIPPET=$(tail -n 60 eas-build.log)
            PAYLOAD=$(jq -n --arg body "### 🔍 EAS Build Diagnostic Log
\`\`\`
$LOG_SNIPPET
\`\`\`" '{body: $body}')
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -d "$PAYLOAD" || true
          fi
